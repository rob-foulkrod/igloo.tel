name: CI & Publish to GitHub Packages

on:
  push:
    branches: [ main ]
    paths:
      - 'src/Igloo.Telemetry/**'
      - '.github/workflows/ci-publish.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'src/Igloo.Telemetry/**'
      - '.github/workflows/ci-publish.yml'

env:
  PACKAGE_PROJECT: src/Igloo.Telemetry/Igloo.Telemetry.csproj
  BUILD_CONFIGURATION: Release

jobs:
  build:
    name: Build & Pack
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Restore
        run: dotnet restore ${{ env.PACKAGE_PROJECT }}

      - name: Build
        run: dotnet build ${{ env.PACKAGE_PROJECT }} --configuration ${{ env.BUILD_CONFIGURATION }} --no-restore

      - name: Compute version
        id: version
        run: |
          BASE=$(dotnet msbuild ${{ env.PACKAGE_PROJECT }} -getProperty:Version)
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "version=$BASE" >> "$GITHUB_OUTPUT"
          else
            echo "version=$BASE-pre.${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Pack
        run: |
          dotnet pack ${{ env.PACKAGE_PROJECT }} \
            --configuration ${{ env.BUILD_CONFIGURATION }} \
            --no-build \
            /p:Version=${{ steps.version.outputs.version }} \
            --output ./nupkg

      - name: Upload nupkg artifact
        uses: actions/upload-artifact@v4
        with:
          name: nupkg
          path: ./nupkg/*.nupkg

  publish:
    name: Push to GitHub Packages
    runs-on: ubuntu-latest
    needs: build
    # Only publish from main
    if: github.ref == 'refs/heads/main'

    permissions:
      packages: write
      contents: read

    steps:
      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Download nupkg artifact
        uses: actions/download-artifact@v4
        with:
          name: nupkg
          path: ./nupkg

      # GitHub Packages NuGet feed requires the source to be added with a PAT
      # that has write:packages scope. The built-in GITHUB_TOKEN works for
      # same-org repos. --store-password-in-clear-text is required on Linux
      # runners because the .NET credential store is not available; the token
      # is NOT stored on disk beyond the runner lifetime.
      - name: Add GitHub Packages source
        run: |
          dotnet nuget add source \
            --username ${{ github.actor }} \
            --password ${{ secrets.GITHUB_TOKEN }} \
            --store-password-in-clear-text \
            --name github \
            "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json"

      - name: Push to GitHub Packages
        run: |
          dotnet nuget push ./nupkg/*.nupkg \
            --source github \
            --skip-duplicate

      - name: Push symbols (.snupkg) to GitHub Packages
        run: |
          dotnet nuget push ./nupkg/*.snupkg \
            --source github \
            --skip-duplicate
