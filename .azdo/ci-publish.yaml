trigger:
  branches:
    include:
      - main
  paths:
    include:
      - src/Igloo.Telemetry/**
      - .azdo/ci-publish.yaml

pr:
  branches:
    include:
      - main

pool:
  vmImage: ubuntu-latest

variables:
  buildConfiguration: Release
  packageProject: src/Igloo.Telemetry/Igloo.Telemetry.csproj
  # Format: <projectName>/<feedName>  OR just <feedName> for org-scoped feeds
  vstsFeed: igloo/igloo-packages

stages:
  - stage: CI
    displayName: Build & Test
    jobs:
      - job: Build
        displayName: Build and pack
        steps:
          - task: UseDotNet@2
            displayName: Use .NET 10
            inputs:
              packageType: sdk
              version: 10.x

          - task: DotNetCoreCLI@2
            displayName: Restore
            inputs:
              command: restore
              projects: $(packageProject)
              feedsToUse: select
              vstsFeed: $(vstsFeed)
              includeNuGetOrg: false

          - task: DotNetCoreCLI@2
            displayName: Build
            inputs:
              command: build
              projects: $(packageProject)
              arguments: --configuration $(buildConfiguration) --no-restore

          - bash: |
              if [ "$(Build.SourceBranch)" = "refs/heads/main" ]; then
                VERSION=$(dotnet msbuild $(packageProject) -getProperty:Version)
                echo "##vso[task.setvariable variable=PACKAGE_VERSION]$VERSION"
              else
                BASE=$(dotnet msbuild $(packageProject) -getProperty:Version)
                echo "##vso[task.setvariable variable=PACKAGE_VERSION]${BASE}-pre.$(Build.BuildId)"
              fi
            displayName: Compute package version

          - task: DotNetCoreCLI@2
            displayName: Pack
            inputs:
              command: pack
              packagesToPack: $(packageProject)
              configuration: $(buildConfiguration)
              nobuild: true
              versioningScheme: byEnvVar
              versionEnvVar: PACKAGE_VERSION
              outputDir: $(Build.ArtifactStagingDirectory)/nupkg

          - task: PublishPipelineArtifact@1
            displayName: Publish nupkg artifact
            inputs:
              targetPath: $(Build.ArtifactStagingDirectory)/nupkg
              artifact: nupkg

  - stage: Publish
    displayName: Push to Azure Artifacts
    dependsOn: CI
    # Only push packages from the main branch
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    jobs:
      - job: Push
        displayName: Push NuGet package
        steps:
          - task: DownloadPipelineArtifact@2
            displayName: Download nupkg artifact
            inputs:
              artifact: nupkg
              targetPath: $(Pipeline.Workspace)/nupkg

          - task: NuGetAuthenticate@1
            displayName: Authenticate with Azure Artifacts

          - task: DotNetCoreCLI@2
            displayName: Push to Azure Artifacts feed
            inputs:
              command: push
              packagesToPush: $(Pipeline.Workspace)/nupkg/*.nupkg
              nuGetFeedType: internal
              publishVstsFeed: $(vstsFeed)

          - task: DotNetCoreCLI@2
            displayName: Push symbols (.snupkg) to Azure Artifacts
            inputs:
              command: push
              packagesToPush: $(Pipeline.Workspace)/nupkg/*.snupkg
              nuGetFeedType: internal
              publishVstsFeed: $(vstsFeed)
